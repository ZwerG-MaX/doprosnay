# ═══════════════════════════════════════════════════════════════
#  Пульт наблюдения «Допросная №2» · единый стек через Traefik
#
#  Домены (добавьте в /etc/hosts или DNS):
#    127.0.0.1  pult.local docs.local cloud.local
#
#  Поднять всё:   docker compose up -d --build
#  Журналы:       docker compose logs -f
#  Traefik-дашборд (dev):  http://localhost:8080
# ═══════════════════════════════════════════════════════════════

services:
  # ── Traefik: единая точка входа, маршрутизация по доменам ──
  traefik:
    image: traefik:v3.1
    container_name: rt-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"                 # дев-режим: дашборд на :8080
      - "--log.level=INFO"
      # Для боевого домена + HTTPS (Let's Encrypt) раскомментируйте:
      # - "--entrypoints.websecure.address=:443"
      # - "--certificatesresolvers.le.acme.tlschallenge=true"
      # - "--certificatesresolvers.le.acme.email=it@example.ru"
      # - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "8080:8080"                           # Traefik dashboard (только dev!)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # - traefik_certs:/letsencrypt
    restart: unless-stopped

  # ── Пульт наблюдения (собирается из Dockerfile) ──
  frontend:
    build: .
    container_name: rt-pult
    depends_on:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pult.rule=Host(`pult.local`) || Host(`localhost`) || Host(`127.0.0.1`)"
      - "traefik.http.routers.pult.entrypoints=web"
      - "traefik.http.services.pult.loadbalancer.server.port=80"
    restart: unless-stopped

  # ── ONLYOFFICE Document Server ──
  docs:
    image: onlyoffice/documentserver:latest
    container_name: rt-docs
    environment:
      JWT_ENABLED: "false"                    # в проде включите и впишите тот же секрет в панели «Серверы»
      JWT_SECRET: "rt-docs-secret-change-me"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docs.rule=Host(`docs.local`)"
      - "traefik.http.routers.docs.entrypoints=web"
      - "traefik.http.services.docs.loadbalancer.server.port=80"
    volumes:
      - docs_data:/var/www/onlyoffice/Data
      - docs_log:/var/log/onlyoffice
      - docs_cache:/var/lib/onlyoffice
    restart: unless-stopped

  # ── Nextcloud: минимальное хранилище документов (SQLite, apache) ──
  cloud:
    image: nextcloud:apache
    container_name: rt-cloud
    environment:
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: rt-cloud-2026
      NEXTCLOUD_TRUSTED_DOMAINS: "cloud.local localhost"
      NEXTCLOUD_DEFAULT_PHONE_REGION: "RU"
      # без внешних БД → автоматически используется встроенная SQLite
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cloud.rule=Host(`cloud.local`)"
      - "traefik.http.routers.cloud.entrypoints=web"
      - "traefik.http.services.cloud.loadbalancer.server.port=80"
    volumes:
      - cloud_data:/var/www/html
    restart: unless-stopped

  # ── Mumble (Murmur): голосовой сервер ──
  mumble:
    image: mumblevoip/mumble-server:latest
    container_name: rt-mumble
    environment:
      MUMBLE_SUPERUSER_PASSWORD: "rt-mumble-2026"
      MUMBLE_CONFIG_WELCOMETEXT: "Пульт наблюдения · Допросная · СКИТ"
    ports:
      - "64738:64738/tcp"
      - "64738:64738/udp"
    volumes:
      - mumble_data:/data
    restart: unless-stopped

  # ── Аудиоконсоль в браузере: mumble-web + WebSocket/WebRTC-прокси ──
  # mumble-web — HTML5-клиент (nginx образа отдаёт приложение и проксирует
  #   /proxy → mumble-web-proxy:1337, поэтому имя сервиса ниже ОБЯЗАТЕЛЬНО
  #   должно быть mumble-web-proxy).
  # mumble-web-proxy — мост Mumble ⇄ WebSocket (TCP-контрол) + WebRTC (UDP-звук).
  #   UDP 64737 пробрасывается на хост: браузер шлёт медиа напрямую.
  #   Если UDP недоступен, mumble-web автоматически работает по WebSocket.
  mumble-web-proxy:
    build:
      context: ./infra
      dockerfile: mumble-web-proxy.Dockerfile
    container_name: rt-mumble-proxy
    depends_on:
      - mumble
    ports:
      - "64737:64737/udp"
    restart: unless-stopped

  mumble-web:
    image: leoverto/mumble-web:latest
    container_name: rt-mumble-web
    depends_on:
      - mumble-web-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mumble.rule=Host(`mumble.local`)"
      - "traefik.http.routers.mumble.entrypoints=web"
      - "traefik.http.services.mumble.loadbalancer.server.port=80"
    restart: unless-stopped

  # ── MediaMTX: мост «VMS (RTSP) → WebRTC/HLS» для браузера ──
  media:
    image: bluenviron/mediamtx:latest
    container_name: rt-media
    depends_on:
      - vms-demo
    volumes:
      - ./infra/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554"        # RTSP
      - "8888:8888"        # HLS + HTTP API
      - "8889:8889"        # WebRTC (сигналинг)
      - "8890:8890/udp"    # WebRTC (медиа)
    restart: unless-stopped

  # ── Демо-VMS: эмулятор MACROSCOP (3 тестовых RTSP-потока с таймкодом) ──
  #    MACROSCOP — коммерческая VMS без публичного образа, поэтому в демо
  #    её роль играет ffmpeg-источник. Для реального VMS удалите этот сервис
  #    и пропишите RTSP-адреса ваших камер в infra/mediamtx.yml.
  vms-demo:
    image: jrottenberg/ffmpeg:6.1-alpine
    container_name: rt-vms-demo
    entrypoint: ["sh", "-c"]
    command:
      - |
        ffmpeg -re -f lavfi -i testsrc2=size=1280x720:rate=25 \
          -c:v libx264 -preset ultrafast -tune zerolatency -g 50 -pix_fmt yuv420p \
          -f rtsp rtsp://0.0.0.0:8554/cam01 &
        ffmpeg -re -f lavfi -i testsrc2=size=1920x1080:rate=25 \
          -c:v libx264 -preset ultrafast -tune zerolatency -g 50 -pix_fmt yuv420p \
          -f rtsp rtsp://0.0.0.0:8555/cam02 &
        ffmpeg -re -f lavfi -i smptebars=size=1280x720:rate=25 \
          -c:v libx264 -preset ultrafast -tune zerolatency -g 50 -pix_fmt yuv420p \
          -f rtsp rtsp://0.0.0.0:8556/cam03 &
        wait
    ports:
      - "9554:8554"        # RTSP cam01 (демо)
      - "9555:8555"        # RTSP cam02 (демо)
      - "9556:8556"        # RTSP cam03 (демо)
    restart: unless-stopped

volumes:
  docs_data:
  docs_log:
  docs_cache:
  cloud_data:
  mumble_data:
